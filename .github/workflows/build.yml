name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned formatter
        run: python -m pip install clang-format==18.1.8
      - name: Check first-party formatting
        run: python tools/check_format.py
  native:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@v4
        with:
          # check_hotpaths compares against the PR base or the previous
          # commit, so those objects must be present.
          fetch-depth: 0
      - name: Install host test prerequisites
        run: apt-get update && apt-get install -y gcc python3 make git
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run native regression suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            export KJ_REFERENCE="$BASE_SHA"
          fi
          python3 tests/native/run_host.py
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: apt-get update && apt-get install -y git python3 make
      - name: Bootstrap game source
        run: python3 tools/game/bootstrap.py
      - name: Build both editions
        run: |
          python3 tools/game/hgss_game.py --game heartgold --target 3ds --out "$PWD/build/gold" -j 2
          python3 tools/game/hgss_game.py --game soulsilver --target 3ds --out "$PWD/build/silver" -j 2
          cp build/gold/pokeheartgold.3dsx build/kohjoh-gold.3dsx
          cp build/silver/pokesoulsilver.3dsx build/kohjoh-silver.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: kohjoh-3dsx
          path: build/kohjoh-*.3dsx
